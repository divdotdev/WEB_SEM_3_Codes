<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>

    <h1>Student Registration Form</h1>
    
    <form action="/register" method="POST">
        <label for="studentName">Name:</label><br>
        <input type="text" id="studentName" name="username" required>
        <br><br>

        <label for="studentEmail">Email:</label><br>
        <input type="email" id="studentEmail" name="email" required>
        <br><br>

        <label for="studentCollege">College:</label><br>
        <input type="text" id="studentCollege" name="college" required>
        <br><br>

        <input type="submit" value="Register">
    </form>
    
</body>
</html>
